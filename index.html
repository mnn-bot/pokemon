<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>batalha Pokemon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <main>
        <h1 class="nom">Batalha pokemon</h1>
        
        <button id="sortearBtn">sortear batalha</button>
        <button id="modoclaro">modo claro</button>

        <section class="placar">
            <div>
                <h2 class="az">Time azul</h2>
                <p id="pontosAzul">0 pontos</p>
            </div>

            <div>
                <h2>resultado</h2>
                <p id="resultado">clique para começar</p>
            </div>

            <div>
                <h2 class="ver">Time vermelho</h2>
                <p id="pontosVermelho">0 pontos</p>
            </div>   
        </section>

        <section class="times">
            <div class="time">
                <h2>Time azul</h2>
                <div id="timeAzul" class="card"></div>
            </div>

            <div class="time">
                <h2>Time vermelho</h2>
                <div id="timeVermelho" class="card"></div>
            </div>
        </section>
    </main>


    <script src="script.js"></script>
</body>
</html>
